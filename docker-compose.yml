services:
  jenkins:
    build: ./build
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      TZ: ${TZ}

volumes:
  jenkins_home:
